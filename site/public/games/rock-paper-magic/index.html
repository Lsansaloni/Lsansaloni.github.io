<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Magic — LluckyGames</title>
    <style>
      :root {
        --bg: #0b0f0e;
        --bg-raised: #121918;
        --border: #22302e;
        --text: #e8efed;
        --muted: #93a8a3;
        --accent: #00e68a;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
      }
      h1 { font-size: 1.2rem; margin: 0.5rem 0; letter-spacing: -0.01em; }
      .fighters {
        display: flex;
        gap: 1rem;
        width: 100%;
        max-width: 560px;
        margin: 0.5rem 0;
      }
      .fighter {
        flex: 1;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.8rem;
      }
      .fighter h2 { font-size: 0.85rem; margin: 0 0 0.5rem; color: var(--muted); font-weight: 500; }
      .score { display: flex; align-items: center; gap: 1px; font-size: 1.25rem; line-height: 1; }
      .score .pip { color: #22332f; }
      .score .pip.on { color: var(--accent); }
      .score .count { font-size: 0.72rem; color: var(--muted); letter-spacing: normal; margin-left: 0.5rem; }
      .log {
        width: 100%;
        max-width: 560px;
        min-height: 3.2rem;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.6rem 0.8rem;
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0.5rem 0;
      }
      .log strong { color: var(--text); }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        width: 100%;
        max-width: 560px;
        justify-content: center;
        margin: 0.5rem 0;
      }
      button {
        background: var(--bg-raised);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.55rem 0.9rem;
        font-size: 0.88rem;
        cursor: pointer;
        transition: border-color 0.12s ease;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.35; cursor: not-allowed; }
      button.primary { border-color: var(--accent); }
      .meta { font-size: 0.75rem; color: var(--muted); margin: 0.3rem 0; }
      .result { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.08em; margin: 0.6rem 0; text-align: center; min-height: 1.6rem; }
      .result.win { color: var(--accent); }
      .result.lose { color: var(--danger); }
    </style>
    <script type="module" crossorigin src="./assets/index-_F789WAs.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
